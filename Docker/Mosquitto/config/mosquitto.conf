# Konfigurasi Mosquitto untuk LOCAL DEVELOPMENT saja.
# allow_anonymous true artinya siapa saja bisa connect tanpa username/password.
# nanti di step deployment kita tambah autentikasi.

listener 1883
allow_anonymous true

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout