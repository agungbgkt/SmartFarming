[program:smartfarm-mqtt]
command=php /var/www/smartfarm/server/artisan mqtt:subscribe
numprocs=1
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartfarm/mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:smartfarm-queue]
command=php /var/www/smartfarm/server/artisan queue:work --sleep=3 --tries=3 --max-time=3600
numprocs=1
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=3600
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartfarm/queue.log

[program:smartfarm-reverb]
command=php /var/www/smartfarm/server/artisan reverb:start --host=0.0.0.0 --port=8080
numprocs=1
autostart=true
autorestart=true
startsecs=0
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartfarm/reverb.log

[program:smartfarm-schedule]
command=php /var/www/smartfarm/server/artisan schedule:work
numprocs=1
autostart=true
autorestart=true
startsecs=0
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartfarm/schedule.log